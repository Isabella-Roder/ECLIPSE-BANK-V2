<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Deposite valores na sua conta Eclipse Bank.">
    <title>Depositar | Eclipse Bank</title>
    <link rel="stylesheet" href="../css/eclipse-bank.css">
</head>
<body class="pagina-painel pagina-operacao">
    <header class="cabecalho-painel">
        <a class="marca" href="conta.html">
            <span class="marca-simbolo" aria-hidden="true"><span></span></span>
            <span>ECLIPSE<span>BANK</span></span>
        </a>
        <a class="voltar-painel" href="conta.html">← Voltar para a conta</a>
    </header>

    <main class="conteudo-operacao">
        <section class="cartao-operacao" aria-labelledby="titulo-operacao">
            <header class="cabecalho-operacao">
                <span class="icone-operacao credito" aria-hidden="true">＋</span>
                <div>
                    <p class="etiqueta">ADICIONAR SALDO</p>
                    <h1 id="titulo-operacao">Fazer depósito</h1>
                    <p>Informe o valor que deseja adicionar à sua conta.</p>
                </div>
            </header>

            <form id="form-deposito" class="form-operacao">
                <div class="campo campo-valor">
                    <label for="valor">Valor do depósito</label>
                    <div class="entrada-monetaria">
                        <span>R$</span>
                        <input
                            id="valor"
                            name="valor"
                            type="text"
                            inputmode="decimal"
                            maxlength="19"
                            placeholder="0,00"
                            data-mascara="moeda"
                            required
                            autofocus
                        >
                    </div>
                </div>

                <div class="campo">
                    <label for="descricao">
                        Descrição <span class="opcional">opcional</span>
                    </label>
                    <input
                        id="descricao"
                        name="descricao"
                        type="text"
                        maxlength="180"
                        placeholder="Ex.: depósito inicial"
                    >
                </div>

                <div class="resumo-operacao">
                    <span>Conta de destino</span>
                    <strong id="conta-destino">Carregando...</strong>
                </div>

                <p id="mensagem-operacao" class="mensagem-operacao" role="status" aria-live="polite"></p>

                <button id="botao-confirmar" class="botao-confirmar" type="submit">
                    Confirmar depósito <span aria-hidden="true">→</span>
                </button>
            </form>
        </section>

        <aside class="aviso-operacao">
            <strong>Depósito simulado</strong>
            <p>Esta funcionalidade faz parte do ambiente educacional do Eclipse Bank e não movimenta dinheiro real.</p>
        </aside>
    </main>

    <script src="../script/mascaras.js"></script>
    <script src="../script/deposito.js"></script>
</body>
</html>
